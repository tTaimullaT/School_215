                chatTitle: "Помощник", chatTag: "demo", chatPh: "Напишите ваш вопрос…", listening: "Слушаю…",
                secStaffH: "Учителя и администрация", secStaffNote: "Фото — примеры, замените на настоящие",
                secCalH: "Календарь событий", secCalNote: "Нажмите на день, чтобы увидеть события",
                secContactH: "Контакты", contactLead: "По любому вопросу — звоните, пишите или спросите помощника.",
                contactCome: "Рады видеть вас!", cAddress: "Адрес", cPhone: "Телефон", cEmail: "Эл. почта", cHours: "Часы приёмной",
                calToday: "Сегодня", calNone: "В этот день событий нет", calEvents: "События",
                aboutKicker: "О школе", aboutH: "Наша школа", aboutMissionT: "Наша миссия", stagesH: "Ступени обучения",
                rulesKicker: "Порядок и безопасность", rulesH: "Правила школы",
                newsKicker: "Жизнь школы", newsH: "Новости и объявления",
                galleryKicker: "Моменты жизни школы", galleryH: "Фотогалерея",
                youLabel: "ВЫ", botLabel: "ПОМОЩНИК",
                chatGreet: "Привет! Я помощник школы «Дарын». Уроки, форма, кружки, контакты — напишите или скажите голосом любой вопрос.",
                chatHello: "Привет! Задавайте любой вопрос — отвечу.",
                chatThanks: "Всегда рад помочь!", chatBye: "До свидания! Если что — я на месте.",
                chatFallback: "На такой вопрос у меня пока нет ответа — он появится, когда подключится основной бот. Сейчас можно позвонить: {phone}. Или спросите что-то из этого:",
                voiceNS: "Ваш браузер не поддерживает распознавание речи. Попробуйте Chrome или напишите текстом.",
                voiceNo: "Речь не распознана — попробуйте ещё раз.", voiceMic: "Нет доступа к микрофону.",
                footQuick: "Быстрые вопросы", footNote: "Все данные — примерные. Актуальную информацию уточняйте в администрации.", sampleTag: "ПРИМЕР",
                months: ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"],
                monthsG: ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"],
                weekdays: ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"]
            }
        };

        /* ══════════ engine ══════════ */
        const $ = s => document.querySelector(s);
        const el = h => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstElementChild; };
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const norm = s => (s || "").toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ").trim();
        const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

        const state = {
            lang: "kz", voiceLang: "kz", greeted: false, busy: false,
            calMonth: null, calSel: null, gi: 0, listening: false
        };
        try { state.lang = localStorage.getItem("schoolLang") || "kz"; } catch (e) { }
        const t = k => (T[state.lang][k] != null ? T[state.lang][k] : k);

        const drawer = $("#drawer"), scrim = $("#scrim"), msgs = $("#msgs"), input = $("#chatInput"),
            micBtn = $("#micBtn"), listenPill = $("#listenPill"), lbox = $("#lbox"), lbImg = $("#lbImg"), lbCap = $("#lbCap");

        /* events map (offsets → real dates, so it always looks current) */
        const evMap = new Map();
        const dk = d => d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
        CONFIG.events.forEach(e => {
            const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + e.d);
            const k = dk(d); evMap.set(k, (evMap.get(k) || []).concat(e));
        });
        state.calMonth = new Date(); state.calMonth.setDate(1);
        state.calSel = dk(new Date());

        /* ── language ── */
        function applyLang(l) {
            state.lang = l; state.voiceLang = l;
            try { localStorage.setItem("schoolLang", l) } catch (e) { }
            document.documentElement.lang = l === "kz" ? "kk" : "ru";
            document.querySelectorAll("[data-setlang]").forEach(b => b.classList.toggle("on", b.dataset.setlang === l));
            document.querySelectorAll("[data-voicelang]").forEach(b => b.classList.toggle("on", b.dataset.voicelang === l));
            document.querySelectorAll("[data-i18n]").forEach(n => { const v = T[l][n.dataset.i18n]; if (v != null) n.textContent = v; });
            document.querySelectorAll("[data-i18n-ph]").forEach(n => { n.placeholder = T[l][n.dataset.i18nPh] || ""; });
            $("#brandName").textContent = CONFIG.schoolName[l];
            $("#brandAddr").textContent = CONFIG.address[l];
            renderAll();
        }
        function renderAll() {
            const l = state.lang;
            /* ticker */
            const items = CONFIG.announcements[l].map(a => `<span class="tk">${a}</span><span class="tk-s">•</span>`).join("");
            $("#tickMove").innerHTML = items + items;
            /* stats */
            $("#statsBar").innerHTML = CONFIG.stats.map(s => `<div class="stat"><span>${s.k[l]}</span><b>${s.v[l]}</b></div>`).join("");
            /* hero chips */
            $("#heroChips").innerHTML = CONFIG.chips[l].map(q => `<button class="chip" data-q="${q}">${q}</button>`).join("");
            /* staff */
            const f = CONFIG.staff[0];
            $("#staffGrid").innerHTML = `
    <div class="pf"><div class="pf-img"><img src="https://picsum.photos/seed/${f.img}/480/600.jpg" alt="${f.name[l]}"><span class="sample-tag">${t("sampleTag")}</span></div>
    <div class="pf-info"><b>${f.name[l]}</b><p class="pf-role">${f.role[l]}</p><ul>${f.creds[l].map(c => `<li>${c}</li>`).join("")}</ul></div></div>
    <div>${CONFIG.staff.slice(1).map((p, i) => `
      <div class="pr"><span class="pr-num">${String(i + 2).padStart(2, "0")}</span>
      <div><b>${p.name[l]}</b><p class="pr-role">${p.role[l]}</p><p class="pr-cred">${p.creds[l]}</p></div></div>`).join("")}</div>`;
            /* contact */
            $("#contactRows").innerHTML = [
                ["map-pin", t("cAddress"), CONFIG.address[l]], ["phone", t("cPhone"), CONFIG.contact.phone],
                ["mail", t("cEmail"), CONFIG.contact.email], ["clock", t("cHours"), CONFIG.contact.hours[l]]
            ].map(([ic, a, b]) => `<div class="c-row"><span class="c-ic"><i data-lucide="${ic}"></i></span><div><b>${a}</b><span>${b}</span></div></div>`).join("");
            /* about */
            $("#aboutText").innerHTML = CONFIG.about.text[l].map(p => `<p>${p}</p>`).join("");
            $("#aboutMission").textContent = CONFIG.about.mission[l];
            $("#stagesList").innerHTML = CONFIG.about.stages.map(s => `
    <div class="stage"><span class="stage-n">${s.n}</span><div><b>${s.t[l]}</b><span class="stage-sub">${s.sub[l]}</span></div><p>${s.p[l]}</p></div>`).join("");
            /* rules */
            $("#rulesList").innerHTML = CONFIG.rules.map((r, i) => `
    <div class="rule${i === 0 ? " open" : ""}"><button class="rule-head"><span class="rule-n">${String(i + 1).padStart(2, "0")}</span><b>${r.title[l]}</b><i data-lucide="plus"></i></button>
    <div class="rule-body"><ul>${r.items[l].map(x => `<li>${x}</li>`).join("")}</ul></div></div>`).join("");
            /* news */
            const n0 = CONFIG.news[0];
            $("#newsGrid").innerHTML = `
    <article class="nf"><div class="nf-imgw"><img src="https://picsum.photos/seed/${n0.img}/720/480.jpg" alt=""><span class="sample-tag">${t("sampleTag")}</span></div>
    <div class="nf-info"><p class="n-meta">${n0.date[l]} · ${n0.tag[l]}</p><b>${n0.title[l]}</b><p>${n0.body[l]}</p></div></article>
    <div>${CONFIG.news.slice(1).map(n => `
      <div class="nw"><button class="nw-head"><div><p class="n-meta">${n.date[l]} · ${n.tag[l]}</p><b>${n.title[l]}</b></div><i data-lucide="plus"></i></button>
      <div class="nw-body"><p>${n.body[l]}</p></div></div>`).join("")}</div>`;
            /* gallery */
            $("#galleryGrid").innerHTML = CONFIG.gallery.map((g, i) => `
    <figure class="g-item" data-gi="${i}"><img src="https://picsum.photos/seed/${g.seed}/640/480.jpg" alt="${g.cap[l]}"><figcaption class="g-cap">${g.cap[l]}</figcaption></figure>`).join("");
            /* footer */
            $("#footName").textContent = CONFIG.schoolName[l];
            $("#footContact").innerHTML = [["map-pin", CONFIG.address[l]], ["phone", CONFIG.contact.phone], ["mail", CONFIG.contact.email]]
                .map(([ic, v]) => `<div class="f-row"><i data-lucide="${ic}"></i><span>${v}</span></div>`).join("");
            $("#footQuick").innerHTML = CONFIG.chips[l].map(q => `<button class="fq" data-q="${q}">${q}</button>`).join("");
            renderCalendar();
            runDemo();
            if (!state.listening) input.placeholder = t("chatPh");
            if (window.lucide) lucide.createIcons();
        }

        /* ── calendar ── */
        function renderCalendar() {
            const l = state.lang, M = T[l].months, y = state.calMonth.getFullYear(), m = state.calMonth.getMonth();
            $("#calTitle").textContent = `${M[m]} ${y}`;
            $("#calWeek").innerHTML = T[l].weekdays.map(d => `<span>${d}</span>`).join("");
            const today = dk(new Date());
            let html = "";
            const off = (new Date(y, m, 1).getDay() + 6) % 7;
            for (let i = 0; i < off; i++) html += "<span></span>";
            const dim = new Date(y, m + 1, 0).getDate();
            for (let d = 1; d <= dim; d++) {
                const k = `${y}-${m + 1}-${d}`, ev = evMap.get(k);
                const cls = ["cal-cell"]; if (k === today) cls.push("today"); if (k === state.calSel) cls.push("sel");
                const dots = ev ? `<span class="cal-dots">${"<i></i>".repeat(Math.min(ev.length, 3))}</span>` : "";
                html += `<button class="${cls.join(" ")}" data-date="${k}">${d}${dots}</button>`;
            }
            $("#calGrid").innerHTML = html;
            renderCalSide();
        }
        function renderCalSide() {
            const l = state.lang;
            const [y, m, d] = state.calSel.split("-").map(Number);
            const mg = (T[l].monthsG || T[l].months);
            const isToday = state.calSel === dk(new Date());
            const evs = evMap.get(state.calSel) || [];
            $("#calSide").innerHTML = `
    <div class="cal-date">${d} ${mg[m - 1]}${isToday ? ` <span class="cal-today-tag">${t("calToday")}</span>` : ""}</div>
    <div class="cal-sub">${t("calEvents")}</div>
    ${evs.length ? evs.map(ev => `<div class="cal-ev"><i data-lucide="calendar-check"></i><span>${ev.t[l]}</span></div>`).join("")
                    : `<p class="cal-empty">${t("calNone")}</p>`}`;
            if (window.lucide) lucide.createIcons();
        }
        function navCal(d) {
            const y = state.calMonth.getFullYear(), m = state.calMonth.getMonth();
            state.calMonth = new Date(y, m + d, 1); renderCalendar();
        }

        /* ── router (separate links: #/about, #/rules, #/news, #/gallery) ── */
        const PAGES = ["main", "about", "rules", "news", "gallery"];
        function route() {
            let p = (location.hash || "#/").replace(/^#\/?/, "") || "main";
            if (!PAGES.includes(p)) p = "main";
            PAGES.forEach(x => $("#page-" + x).classList.toggle("active", x === p));
            document.querySelectorAll(".nav a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#/" + (p === "main" ? "" : p)));
            window.scrollTo(0, 0);
        }
        window.addEventListener("hashchange", route);

        /* ── chat ── */
        function scrollMsgs() { msgs.scrollTop = msgs.scrollHeight; }
        function openDrawer(skipGreet) {
            drawer.classList.add("open"); scrim.classList.add("show");
            document.body.classList.add("chat-open");
            if (!state.greeted && !skipGreet) { state.greeted = true; botSay(t("chatGreet"), CONFIG.chips[state.lang]); }
            setTimeout(() => input.focus(), 300);
        }
        function closeDrawer() {
            drawer.classList.remove("open"); scrim.classList.remove("show");
            document.body.classList.remove("chat-open");
        }
        function askNow(q) { openDrawer(true); setTimeout(() => sendQuestion(q), 350); }
        function addUser(txt) {
            const m = el(`<div class="msg you"><div class="who">${t("youLabel")}</div><div class="txt"></div></div>`);
            m.querySelector(".txt").textContent = txt; msgs.append(m); scrollMsgs();
        }
        function botSay(txt, chips) {
            const m = el(`<div class="msg bot"><div class="who">${t("botLabel")}</div><div class="txt"></div></div>`);
            m.querySelector(".txt").textContent = txt; msgs.append(m); scrollMsgs();
            if (chips) {
                const w = el(`<div class="chips-row"></div>`);
                chips.forEach(q => { const b = el(`<button class="chip" data-q="${q}"></button>`); b.textContent = q; w.append(b); });
                msgs.append(w); scrollMsgs();
            }
        }
        /* ✎ REAL BOT HOOK — when you fill CONFIG.botApi.url + key, your bot answers instead */
        async function getBotAnswer(text) {
            if (CONFIG.botApi.url) {
                try {
                    const res = await fetch(CONFIG.botApi.url, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            ...(CONFIG.botApi.key ? { "Authorization": "Bearer " + CONFIG.botApi.key } : {})
                        },
                        body: JSON.stringify({ message: text, lang: state.lang })
                    });
                    const ct = res.headers.get("content-type") || "";
                    if (ct.includes("json")) { const d = await res.json(); const r = d.reply || d.answer || d.message || d.text; if (r) return { text: String(r) }; }
                    else { const tx = await res.text(); if (tx) return { text: tx.trim() }; }
                } catch (e) { /* fall through to demo brain */ }
            }
            await sleep(450 + Math.random() * 450);
            return botReply(text);
        }
        function botReply(raw) {
            const l = state.lang, q = norm(raw);
            if (!q) return { text: t("chatGreet"), chips: CONFIG.chips[l] };
            if (["сәлем", "салам", "привет", "здрав", "добр", "қайырлы"].some(g => q.includes(g)))
                return { text: t("chatHello"), chips: CONFIG.chips[l] };
            if (q.includes("рахмет") || q.includes("спасибо")) return { text: t("chatThanks") };
            if (["сау бол", "пока", "до свидан"].some(b => q.includes(b))) return { text: t("chatBye") };
            let best = null, bs = 0;
            for (const e of CONFIG.kb) {
                let s = 0;
                for (const k of e.k) {
                    const nk = norm(k);
                    if (nk.includes(" ")) { if (q.includes(nk)) s += 2; }
                    else if (q.split(" ").includes(nk)) s++;
                    else if (nk.length > 4 && q.includes(nk)) s += .5;
                }
                if (s > bs) { bs = s; best = e; }
            }
            if (best && bs >= 1) return { text: best.a[l] };
            const picks = [...CONFIG.kb].sort(() => Math.random() - .5).slice(0, 4).map(e => e.q[l]);
            return { text: t("chatFallback").replace("{phone}", CONFIG.contact.phone), chips: picks };
        }
        async function sendQuestion(text) {
            text = (text || "").trim();
            if (!text || state.busy) return;
            state.busy = true;
            addUser(text); input.value = "";
            const tp = el(`<div class="msg bot"><div class="who">${t("botLabel")}</div><div class="txt dots"><span></span><span></span><span></span></div></div>`);
            msgs.append(tp); scrollMsgs();
            const r = await getBotAnswer(text);
            tp.remove(); botSay(r.text, r.chips);
            state.busy = false;
        }
        $("#chatForm").addEventListener("submit", e => { e.preventDefault(); sendQuestion(input.value); });

        /* ── voice input (Web Speech API — free, no key; works best in Chrome) ── */
        let recog = null, gotFinal = false;
        function sysNote(txt) { botSay(txt); }
        function setListening(b) {
            state.listening = b;
            micBtn.classList.toggle("live", b);
            listenPill.hidden = !b;
            input.placeholder = b ? t("listening") : t("chatPh");
        }
        function startVoice() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) { sysNote(t("voiceNS")); return; }
            if (state.listening) { try { recog.stop() } catch (e) { } return; }
            recog = new SR();
            recog.lang = state.voiceLang === "kz" ? "kk-KZ" : "ru-RU";
            recog.interimResults = true; recog.continuous = false;
            gotFinal = false;
            recog.onstart = () => setListening(true);
            recog.onresult = e => {
                let fin = "", int = "";
                for (let i = e.resultIndex; i < e.results.length; i++) {
                    const r = e.results[i];
                    if (r.isFinal) fin += r[0].transcript; else int += r[0].transcript;
                }
                if (fin) { gotFinal = true; input.value = fin.trim(); }
                else if (int) input.value = int.trim();
            };
            recog.onerror = e => {
                setListening(false);
                if (e.error === "no-speech" || e.error === "aborted") sysNote(t("voiceNo"));
                else if (e.error === "not-allowed" || e.error === "service-not-allowed") sysNote(t("voiceMic"));
                else sysNote(t("voiceNS"));
            };
            recog.onend = () => {
                setListening(false);
                if (gotFinal && input.value.trim()) setTimeout(() => sendQuestion(input.value), 250);
            };
            try { recog.start() } catch (e) { }
        }

        /* ── hero demo (auto-typing conversation) ── */
        let demoGen = 0;
        function demoLine(cls, txt) { const d = document.createElement("div"); d.className = "dl dl-" + cls; d.textContent = (cls === "q" ? "? " : "") + txt; return d; }
        const trimDemo = b => { while (b.children.length > 6) b.firstChild.remove(); };
        async function typeDemo(body, cls, txt, g) {
            const d = document.createElement("div"); d.className = "dl dl-" + cls;
            const s = document.createElement("span"); d.append((cls === "q" ? "? " : ""), s);
            const c = document.createElement("span"); c.className = "cur"; d.append(c);
            body.append(d);
            for (const ch of txt) { if (g !== demoGen) return; s.textContent += ch; await sleep(24 + Math.random() * 26); }
            c.remove();
        }
        async function runDemo() {
            const g = ++demoGen, body = $("#askBody"), pairs = CONFIG.demo[state.lang];
            body.innerHTML = "";
            if (reduced) { pairs.forEach(p => { body.append(demoLine("q", p.q)); body.append(demoLine("a", p.a)); }); return; }
            while (true) {
                for (const p of pairs) {
                    if (g !== demoGen) return;
                    trimDemo(body);
                    await typeDemo(body, "q", p.q, g); if (g !== demoGen) return;
                    const ty = document.createElement("div"); ty.className = "dl dl-typing"; ty.innerHTML = "<i></i><i></i><i></i>"; body.append(ty);
                    await sleep(650); if (g !== demoGen) return; ty.remove();
                    trimDemo(body);
                    await typeDemo(body, "a", p.a, g); if (g !== demoGen) return;
                    await sleep(1800);
                }
            }
        }

        /* ── gallery lightbox ── */
        function showLbox() {
            const g = CONFIG.gallery[state.gi];
            lbImg.src = `https://picsum.photos/seed/${g.seed}/1200/900.jpg`;
            lbCap.textContent = g.cap[state.lang];
        }
        function openLbox(i) { state.gi = i; showLbox(); lbox.hidden = false; }
        function stepLbox(d) { state.gi = (state.gi + d + CONFIG.gallery.length) % CONFIG.gallery.length; showLbox(); }

        /* ── one global click handler: everything is wired ── */
        document.addEventListener("click", e => {
            const sl = e.target.closest("[data-setlang]"); if (sl) { applyLang(sl.dataset.setlang); return; }
            const vl = e.target.closest("[data-voicelang]"); if (vl) {
                state.voiceLang = vl.dataset.voicelang;
                document.querySelectorAll("[data-voicelang]").forEach(b => b.classList.toggle("on", b.dataset.voicelang === state.voiceLang));
                return;
            }
            if (e.target.closest("[data-open-chat]")) { openDrawer(); return; }
            const q = e.target.closest("[data-q]"); if (q) { askNow(q.dataset.q); return; }
            const rh = e.target.closest(".rule-head"); if (rh) { rh.closest(".rule").classList.toggle("open"); return; }
            const nh = e.target.closest(".nw-head"); if (nh) { nh.closest(".nw").classList.toggle("open"); return; }
            const gi = e.target.closest(".g-item"); if (gi) { openLbox(+gi.dataset.gi); return; }
            const cn = e.target.closest("[data-calnav]"); if (cn) { navCal(+cn.dataset.calnav); return; }
            const cd = e.target.closest("[data-date]"); if (cd) { state.calSel = cd.dataset.date; renderCalendar(); return; }
            if (e.target.closest("#micBtn")) { startVoice(); return; }
            if (e.target.closest("#drClose") || e.target === scrim) { closeDrawer(); return; }
            if (e.target.closest(".lb-close") || e.target === lbox) { lbox.hidden = true; return; }
            if (e.target.closest(".lb-prev")) { stepLbox(-1); return; }
            if (e.target.closest(".lb-next")) { stepLbox(1); return; }
        });

        document.addEventListener("keydown", e => {
            if (e.key === "Escape") {
                if (!lbox.hidden) lbox.hidden = true;
                else if (drawer.classList.contains("open")) closeDrawer();
            }
            if (!lbox.hidden) {
                if (e.key === "ArrowLeft") stepLbox(-1);
                if (e.key === "ArrowRight") stepLbox(1);
            }
        });

        /* ── init ── */
        applyLang(state.lang);
        route();
    </script>
</body>

</html>
